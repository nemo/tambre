<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tambre</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafaf8; --mut: #6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececea; --bg: #141413; --mut: #9a9a94; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 36rem; margin: 18vh auto; padding: 0 16px; }
  h1 { font-weight: 500; font-size: 1.6rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1rem; } .mut { color: var(--mut); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Tambre</h1>
  <p>Hear what your coding agent is doing. A drone while it works, a held tension while it waits on you, a bell when it is done. One texture per project, so you can tell which one stopped.</p>
  <p class="mut">Being rebuilt. The earlier registry spec and design library live at the <a href="https://github.com/nemo/tambre/tree/v0-library">v0-library</a> tag.</p>
</main>
</body>
</html>
